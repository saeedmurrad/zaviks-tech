<article class="card link">
  <app-product-mock [kind]="product().mock" />
  <div class="card-kicker">
    <span class="tag">{{ product().category }}</span>
    @if (product().demo === 'live') {
      <span class="tag tag-live">Live demo</span>
    }
  </div>
  <h3 class="card-title">
    <a [routerLink]="['/shelf', product().slug]">{{ product().name }}</a>
  </h3>
  <p>{{ product().promise }}</p>
  <div class="card-foot">
    <span class="price">{{ product().priceLabel }}</span>
    <span class="text-link">
      View
      <svg
        class="arrow"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </span>
  </div>
</article>
